services:
  app:
    build: .
    environment:
      - DB_HOST=db
      - DB_USER=etrm_user
      - DB_PASSWORD=changeme
      - DB_NAME=etrm
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=etrm_user
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=etrm
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data: